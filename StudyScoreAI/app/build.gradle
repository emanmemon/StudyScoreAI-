plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.studyscoreai'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.studyscoreai"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // IMPORTANT: the .tflite file must NOT be compressed, otherwise it cannot be memory-mapped.
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    // TensorFlow Lite runtime (on-device inference). Version is pinned for reproducible builds.
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    testImplementation 'junit:junit:4.13.2'
}
